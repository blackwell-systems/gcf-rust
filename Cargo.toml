[package]
name = "gcf"
version = "3.0.1"
edition = "2021"
description = "The AI-native wire format for structured data. 50-92% fewer tokens than JSON, with multi-turn delta encoding for agent loops. 100% comprehension on every frontier model. Zero dependencies (except serde)."
license = "MIT"
repository = "https://github.com/blackwell-systems/gcf-rust"
homepage = "https://gcformat.com/"
keywords = ["gcf", "llm", "mcp", "tokens", "wire-format"]
categories = ["encoding", "data-structures"]
readme = "README.md"

[lib]
name = "gcf"
path = "src/lib.rs"

[[bin]]
name = "gcf"
path = "src/main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }

[dev-dependencies]
# arbitrary_precision lets the conformance runner ingest bare-integer JSON literals
# beyond 2^53 (e.g. 10^20) as exact lexemes rather than pre-floating them, so the
# numeric-domain encode / encode-error fixtures (numbers/012, 020-023) can distinguish
# an out-of-domain integer literal from a genuine double of the same magnitude (SPEC
# 2.3.2). Feature-unified into the codec under test, where format_number_checked
# handles the preserved-lexeme path.
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision"] }
serde_yaml = "0.9"
csv = "1"
rmp-serde = "1"
toml = "0.8"
rayon = "1"
